version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"   # exposed to host for local DB tools (pgAdmin/DBeaver etc.)
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"   # grpc, handy in dev
    volumes:
      - qdrant_data_dev:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  recognition-backend:
    build:
      context: ./apps/recognition-backend
      dockerfile: Dockerfile.dev        # separate dev Dockerfile (installs dev deps, no multi-stage prod build)
    container_name: recognition-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload   # adjust module path (main:app) as needed
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./apps/recognition-backend:/app          # live code mount
      - insightface_models_dev:/root/.insightface
      # - /app/venv   # uncomment + adjust if you use a venv inside the image, to avoid host overwrite
    healthcheck:                                                    # <-- add this whole block
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s  
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile.dev  # dev Dockerfile, installs devDependencies too
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
    command: npm run dev        # or: npx nodemon src/index.js / ts-node-dev --respawn src/index.ts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      recognition-backend:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app              # live code mount
      - /app/node_modules                # anonymous volume so container's node_modules isn't shadowed by host
      - ./apps/backend/storage:/app/storage

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0   # vite dev server; adjust flags for CRA/webpack if different
    ports:
      - "3000:3000"          # dev server port, not the nginx :80 from prod
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

volumes:
  postgres_data_dev:
  qdrant_data_dev:
  insightface_models_dev:
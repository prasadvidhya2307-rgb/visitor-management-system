version: "3.9"
name: vms_production

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_vms_prod
    restart: unless-stopped

    env_file:
      - ./.env.production

    expose:
      - "5432"

    volumes:
      - postgres_vms_production:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vms_prod
    restart: unless-stopped

    expose:
      - "6333"

    volumes:
      - qdrant_vms_production:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/6333'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  recognition-backend:
    build:
      context: ./apps/recognition-backend
      dockerfile: Dockerfile

    container_name: recognition-backend_vms_prod
    restart: unless-stopped

    env_file:
      - ./.env.production

    environment:
      NODE_ENV: production

    volumes:
      - insightface_vms_production:/root/.insightface

    expose:
      - "8000"

    depends_on:
      qdrant:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile

    container_name: backend_vms_prod
    restart: unless-stopped

    env_file:
      - ./.env.production

    environment:
      NODE_ENV: production

    expose:
      - "5000"

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      recognition-backend:
        condition: service_healthy

    volumes:
      - storage_vms_production:/app/storage

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile

    container_name: frontend_vms_prod
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_vms_production:
  qdrant_vms_production:
  insightface_vms_production:
  storage_vms_production:

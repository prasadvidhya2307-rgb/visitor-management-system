version: "3.9"
name: visitor system testing

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    expose:
      - "5432"

    volumes:
      - postgres_data_production:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    expose:
      - "6333"

    volumes:
      - qdrant_data_production:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/6333'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  recognition-backend:
    build:
      context: ./apps/recognition-backend
      dockerfile: Dockerfile

    container_name: recognition-backend
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      NODE_ENV: production

    expose:
      - "8000"

    depends_on:
      qdrant:
        condition: service_healthy

    volumes:
      - insightface_models_production:/root/.insightface

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile

    container_name: backend
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      NODE_ENV: production

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_healthy

      recognition-backend:
        condition: service_healthy

    volumes:
      - ./apps/backend/storage:/app/storage

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile

    container_name: frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data_production:
  qdrant_data_production:
  insightface_models_production:
version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visitor_management

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped

    expose:
      - "6333"

    volumes:
      - qdrant_data:/qdrant/storage

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  recognition-backend:
    build:
      context: ./apps/recognition-backend
      dockerfile: Dockerfile

    container_name: recognition-backend
    restart: unless-stopped

    env_file:
      - ./.env.production

    expose:
      - "8000"

    depends_on:
      qdrant:
        condition: service_healthy

    volumes:
      - insightface_models:/root/.insightface

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile

    container_name: backend
    restart: unless-stopped

    env_file:
      - ./.env.production

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_healthy

      recognition-backend:
        condition: service_healthy

    volumes:
      - ./apps/backend/storage:/app/storage

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile

    container_name: frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  insightface_models: